
<div class="app-container">

  <header>
    <h1>BidZone</h1>
    <p>Online Auction & Bidding Marketplace</p>
  </header>

  <nav>
    <button (click)="activePage = 'history'"
      [class.active]="activePage === 'history'">
      Auction History
    </button>

    <button (click)="activePage = 'winners'"
      [class.active]="activePage === 'winners'">
      Winners
    </button>

    <button (click)="activePage = 'payments'"
      [class.active]="activePage === 'payments'">
      Payments
    </button>

    <button (click)="activePage = 'transactions'"
      [class.active]="activePage === 'transactions'">
      Transactions
    </button>
  </nav>

  <main>
    @if (activePage === 'history') {
      <app-auction-history></app-auction-history>
    }

    @if (activePage === 'winners') {
      <app-winner-details></app-winner-details>
    }

    @if (activePage === 'payments') {
      <app-payment-status></app-payment-status>
    }

    @if (activePage === 'transactions') {
      <app-transaction-history></app-transaction-history>
    }
  </main>

  <footer>
    <p>BidZone | Online Auction Marketplace</p>
  </footer>

</div>
